name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch macht den laufenden Build überflüssig.
# Tags bleiben aussen vor: ein Release soll nie abgebrochen werden.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Ohne Anmeldung an ghcr.io -- Pull Requests aus Forks -- gibt es
          # keinen Schreibzugriff auf den Cache. Lesen geht trotzdem, das
          # Paket ist öffentlich.
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "cache-writable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-writable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Commit landet als Literal im Bundle und trägt die Anzeige
          # unten auf der Einstellungsseite. Nur für Branch-Pushes: aus einem
          # Tag gebaute Images sollen ihre Release-Version zeigen, und "main"
          # allein wäre als Angabe wertlos -- den Branch gibt es in beliebig
          # vielen Ständen, den Commit genau einmal.
          build-args: COMMIT_SHA=${{ github.ref_type == 'branch' && github.sha || '' }}
          # Der Cache liegt als eigenes Paket in derselben Registry, nicht im
          # GitHub-Actions-Cache. Zwei Gründe: das Hochladen dauerte dort
          # 55 s von 165 s Gesamtzeit, und der Actions-Cache ist nach Branch
          # getrennt -- der Build auf main nach dem Merge konnte den Cache des
          # gerade gemergten PR nicht lesen und lief jedes Mal komplett neu.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: ${{ steps.image.outputs.cache-writable == 'true' && format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, steps.image.outputs.name) || '' }}
          provenance: mode=max
          sbom: true
