name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch macht den laufenden Build überflüssig.
# Tags bleiben aussen vor: ein Release soll nie abgebrochen werden.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check Dockerfile matches .nvmrc
        shell: bash
        run: |
          # The FROM tags are literal on purpose -- Dependabot skips any FROM
          # line containing a variable -- so this is what keeps them from
          # drifting away from .nvmrc. Bump both together.
          expected="$(tr -d '[:space:]' < .nvmrc)"
          found="$(grep -oP '^FROM node:\K[^-]+' Dockerfile | sort -u | paste -sd, -)"
          if [ "$found" != "$expected" ]; then
            echo "::error file=Dockerfile::Dockerfile builds on Node $found, .nvmrc says $expected"
            exit 1
          fi

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Ohne Anmeldung an ghcr.io -- Pull Requests aus Forks -- gibt es
          # keinen Schreibzugriff auf den Cache. Lesen geht trotzdem, das
          # Paket ist öffentlich.
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "cache-writable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-writable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Commit landet als Literal im Bundle und trägt die Anzeige
          # unten auf der Einstellungsseite. Ein Tag-Build bekommt ihn nicht:
          # dort ist die Release-Version die Identität. Alles andere braucht
          # ihn -- ein Branchname allein wäre als Angabe wertlos, den gibt es
          # in beliebig vielen Ständen, den Commit genau einmal.
          #
          # Die Bedingung fragt negativ nach dem Tag, wie schon `concurrency`
          # oben: `ref_type == 'branch'` liest sich wie "nur Pushes", ist bei
          # einem pull_request aber ebenfalls wahr (der Ref heißt dann
          # refs/pull/N/merge). Deshalb auch head.sha zuerst -- github.sha
          # zeigt im PR auf den flüchtigen Merge-Commit, den es auf keinem
          # Branch gibt und dessen Link nach dem Merge ins Leere führt.
          build-args: COMMIT_SHA=${{ github.ref_type != 'tag' && (github.event.pull_request.head.sha || github.sha) || '' }}
          # Der Cache liegt als eigenes Paket in derselben Registry, nicht im
          # GitHub-Actions-Cache. Zwei Gründe: das Hochladen dauerte dort
          # 55 s von 165 s Gesamtzeit, und der Actions-Cache ist nach Branch
          # getrennt -- der Build auf main nach dem Merge konnte den Cache des
          # gerade gemergten PR nicht lesen und lief jedes Mal komplett neu.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: ${{ steps.image.outputs.cache-writable == 'true' && format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, steps.image.outputs.name) || '' }}
          provenance: mode=max
          sbom: true
